---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    force_apt_get: true
    cache_valid_time: "{{ update_cache_valid_time }}"

- name: Upgrade all packages
  ansible.builtin.apt:
    upgrade: dist
    force_apt_get: true

- name: Check if a reboot is needed
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: update_reboot_required

- name: Reboot if the kernel was updated
  ansible.builtin.reboot:
    msg: Reboot triggered by Ansible after a kernel update
    connect_timeout: 5
    reboot_timeout: 300
    pre_reboot_delay: 0
    post_reboot_delay: 30
    test_command: uptime
  when: update_reboot_required.stat.exists
