---
- name: Update apt cache and packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: safe
    cache_valid_time: 3600

- name: Install security packages
  ansible.builtin.apt:
    name:
      - ufw
      - fail2ban
      - unattended-upgrades
      - curl
      - gnupg
      - ca-certificates
    state: present

- name: Configure timezone
  timezone:
    name: "{{ timezone }}"

