- name: Setup UFW - SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Setup UFW - HTTP
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: Setup UFW - HTTPS
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp

- name: Setup UFW - Docker container port 2376
  community.general.ufw:
    rule: allow
    port: "2376"
    proto: tcp

- name: Setup UFW - Default deny incoming
  community.general.ufw:
    state: enabled
    policy: deny
